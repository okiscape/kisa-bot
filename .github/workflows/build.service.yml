name: Build Service

on:
    workflow_call:
        inputs:
            service_name:
                required: true
                type: string
            filter_paths:
                required: true
                type: string
            dockerfile:
                required: true
                type: string
            context:
                required: true
                type: string
            image_tag:
                required: true
                type: string
            push:
                required: true
                type: boolean

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Check for ${{ inputs.service_name }} changes
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: ${{ inputs.filter_paths }}

            - name: Decide whether to push
              id: meta
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  WANT_PUSH="${{ inputs.push }}"
                  if [ "$REF_NAME" = "main" ] && [ "$WANT_PUSH" = "true" ]; then
                    echo "push=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "push=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "ref_name=$REF_NAME want_push=$WANT_PUSH -> push=$( [ "$REF_NAME" = "main" ] && [ "$WANT_PUSH" = "true" ] && echo true || echo false )"

            - name: Set up Docker Buildx
              if: steps.filter.outputs.src == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: steps.filter.outputs.src == 'true' && steps.meta.outputs.push == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build ${{ inputs.service_name }}
              if: steps.filter.outputs.src == 'true' && steps.meta.outputs.push != 'true'
              uses: docker/build-push-action@v5
              with:
                  context: ${{ inputs.context }}
                  file: ${{ inputs.dockerfile }}
                  push: false
                  load: true
                  tags: ${{ inputs.image_tag }}
                  cache-from: type=gha,scope=${{ inputs.service_name }}
                  cache-to: type=gha,scope=${{ inputs.service_name }},mode=max

            - name: Build and push ${{ inputs.service_name }}
              if: steps.filter.outputs.src == 'true' && steps.meta.outputs.push == 'true'
              uses: docker/build-push-action@v5
              with:
                  context: ${{ inputs.context }}
                  file: ${{ inputs.dockerfile }}
                  push: true
                  tags: ${{ inputs.image_tag }}
                  cache-from: type=gha,scope=${{ inputs.service_name }}
                  cache-to: type=gha,scope=${{ inputs.service_name }},mode=max
